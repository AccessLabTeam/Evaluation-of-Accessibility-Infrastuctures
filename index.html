<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css"><link rel="stylesheet" href="http://maxcdn.bootstrapcdn.com/font-awesome/4.6.1/css/font-awesome.min.css"><link rel="stylesheet" href="css/L.Control.Locate.min.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/Control.OSMGeocoder.css">
        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>
        <title>Evaluation of the Infrastuctures Accessibility</title>
    </head>
    <body>
        <div id="map">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script><script src="js/L.Control.Locate.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/Control.OSMGeocoder.js"></script>
        <script src="data/AccessibilityEvaluation_0.js"></script>
        <script>
        var map = L.map('map', {
            zoomControl:true, maxZoom:28, minZoom:1
        }).fitBounds([[35.5102778651,24.0060735009],[35.5203417314,24.0269940287]]);
        var hash = new L.Hash(map);
        map.attributionControl.addAttribution('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a>');
        L.control.locate().addTo(map);
        var bounds_group = new L.featureGroup([]);
        var basemap0 = L.tileLayer('http://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="http://openstreetmap.org">OpenStreetMap</a> contributors,<a href="http://creativecommons.org/licenses/by-sa/2.0/">CC-BY-SA</a>',
            maxZoom: 28
        });
        basemap0.addTo(map);
        function setBounds() {
        }
        function pop_AccessibilityEvaluation_0(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">Category</th>\
                        <td>' + (feature.properties['Category'] !== null ? Autolinker.link(String(feature.properties['Category'])) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">No</th>\
                        <td>' + (feature.properties['No'] !== null ? Autolinker.link(String(feature.properties['No'])) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">id</th>\
                        <td>' + (feature.properties['id'] !== null ? Autolinker.link(String(feature.properties['id'])) : '') + '</td>\
                    </tr>\
                </table>';
            layer.bindPopup(popupContent, {maxHeight: 400});
        }

        function style_AccessibilityEvaluation_0_0(feature) {
            switch(String(feature.properties['No'])) {
                case '1':
                    return {
                pane: 'pane_AccessibilityEvaluation_0',
                opacity: 1,
                color: 'rgba(0,0,0,0.75)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(0,68,27,0.75)',
            }
                    break;
                case '2':
                    return {
                pane: 'pane_AccessibilityEvaluation_0',
                opacity: 1,
                color: 'rgba(0,0,0,0.75)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(12,120,53,0.75)',
            }
                    break;
                case '3':
                    return {
                pane: 'pane_AccessibilityEvaluation_0',
                opacity: 1,
                color: 'rgba(0,0,0,0.75)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(50,155,81,0.75)',
            }
                    break;
                case '4':
                    return {
                pane: 'pane_AccessibilityEvaluation_0',
                opacity: 1,
                color: 'rgba(0,0,0,0.75)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(96,186,108,0.75)',
            }
                    break;
                case '5':
                    return {
                pane: 'pane_AccessibilityEvaluation_0',
                opacity: 1,
                color: 'rgba(0,0,0,0.75)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(148,211,144,0.75)',
            }
                    break;
                case '6':
                    return {
                pane: 'pane_AccessibilityEvaluation_0',
                opacity: 1,
                color: 'rgba(0,0,0,0.75)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(192,230,185,0.75)',
            }
                    break;
                case '7':
                    return {
                pane: 'pane_AccessibilityEvaluation_0',
                opacity: 1,
                color: 'rgba(0,0,0,0.75)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(226,244,221,0.75)',
            }
                    break;
                case '8':
                    return {
                pane: 'pane_AccessibilityEvaluation_0',
                opacity: 1,
                color: 'rgba(0,0,0,0.75)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(247,252,245,0.75)',
            }
                    break;
            }
        }
        map.createPane('pane_AccessibilityEvaluation_0');
        map.getPane('pane_AccessibilityEvaluation_0').style.zIndex = 400;
        map.getPane('pane_AccessibilityEvaluation_0').style['mix-blend-mode'] = 'normal';
        var layer_AccessibilityEvaluation_0 = new L.geoJson(json_AccessibilityEvaluation_0, {
            attribution: '<a href=""></a>',
            pane: 'pane_AccessibilityEvaluation_0',
            onEachFeature: pop_AccessibilityEvaluation_0,
            style: style_AccessibilityEvaluation_0_0,
        });
        bounds_group.addLayer(layer_AccessibilityEvaluation_0);
        map.addLayer(layer_AccessibilityEvaluation_0);
        var title = new L.Control();
        title.onAdd = function (map) {
            this._div = L.DomUtil.create('div', 'info');
            this.update();
            return this._div;
        };
        title.update = function () {
            this._div.innerHTML = '<h2>Evaluation of the Infrastuctures Accessibility</h2>';
        };
        title.addTo(map);
        var osmGeocoder = new L.Control.OSMGeocoder({
            collapsed: false,
            position: 'topright',
            text: 'Search',
        });
        osmGeocoder.addTo(map);
        var baseMaps = {};
        L.control.layers(baseMaps,{'Accessibility Evaluation<br /><table><tr><td style="text-align: center;"><img src="legend/AccessibilityEvaluation_0_Area30.png" /></td><td>Area 3</td></tr><tr><td style="text-align: center;"><img src="legend/AccessibilityEvaluation_0_Area81.png" /></td><td>Area 8</td></tr><tr><td style="text-align: center;"><img src="legend/AccessibilityEvaluation_0_Area22.png" /></td><td>Area 2</td></tr><tr><td style="text-align: center;"><img src="legend/AccessibilityEvaluation_0_Area13.png" /></td><td>Area 1</td></tr><tr><td style="text-align: center;"><img src="legend/AccessibilityEvaluation_0_Area44.png" /></td><td>Area 4</td></tr><tr><td style="text-align: center;"><img src="legend/AccessibilityEvaluation_0_Area65.png" /></td><td>Area 6</td></tr><tr><td style="text-align: center;"><img src="legend/AccessibilityEvaluation_0_Area56.png" /></td><td>Area 5</td></tr><tr><td style="text-align: center;"><img src="legend/AccessibilityEvaluation_0_Area77.png" /></td><td>Area 7</td></tr></table>': layer_AccessibilityEvaluation_0,},{collapsed:false}).addTo(map);
        setBounds();
        var i = 0;
        layer_AccessibilityEvaluation_0.eachLayer(function(layer) {
            var context = {
                feature: layer.feature,
                variables: {}
            };
            layer.bindTooltip((layer.feature.properties['id'] !== null?String('<div style="color: #000000; font-size: 10pt; font-weight: bold; font-family: \'MS Shell Dlg 2\', sans-serif;">' + layer.feature.properties['id']) + '</div>':''), {permanent: true, offset: [-0, -16], className: 'css_AccessibilityEvaluation_0'});
            labels.push(layer);
            totalMarkers += 1;
              layer.added = true;
              addLabel(layer, i);
              i++;
        });
        resetLabels([layer_AccessibilityEvaluation_0]);
        map.on("zoomend", function(){
            resetLabels([layer_AccessibilityEvaluation_0]);
        });
        map.on("layeradd", function(){
            resetLabels([layer_AccessibilityEvaluation_0]);
        });
        map.on("layerremove", function(){
            resetLabels([layer_AccessibilityEvaluation_0]);
        });
        </script>
    </body>
</html>
